name: readonly-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readonly-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 읽기 전용 검사
        run: node scripts/check-readonly.mjs
